name: Toolbox
options:
  bundleIdPrefix: com.eason3436
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Toolbox:
    type: application
    platform: iOS
    sources:
      - path: Toolbox
        excludes:
          - "AppIcon.icon"
          - "AppIcon.icon/**"
      - path: Toolbox/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Toolbox/Info.plist
      properties:
        CFBundleDisplayName: Toolbox
        CFBundleName: Toolbox
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: 用來讀取原況照片並把處理好的照片存回相簿。
        NSPhotoLibraryAddUsageDescription: 用來把處理好的照片和影片存到相簿。
        UIFileSharingEnabled: true
        # 在 LiveContainer 裡用 LiveContainer 的通用即時動態顯示進度（LCLiveActivityAttributes）。
        NSSupportsLiveActivities: true
        UIAppFonts:
          - NotoSerifTC-Medium.ttf
        NSSpeechRecognitionUsageDescription: 用來把音訊在裝置上轉成文字。
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.eason3436.toolbox.process.*
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: 媒體與文件
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
              - public.movie
              - public.audio
              - com.adobe.pdf
              - public.json
              - public.plain-text
              - public.html
              - public.rtf
              - public.comma-separated-values-text
              - net.daringfireball.markdown
              - org.openxmlformats.wordprocessingml.document
              - org.openxmlformats.spreadsheetml.sheet
              - org.openxmlformats.presentationml.presentation
              - public.content
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eason3436.toolbox
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - ToolboxTests

  ToolboxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ToolboxTests
    dependencies:
      - target: Toolbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eason3436.toolbox.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Toolbox.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Toolbox
        BUNDLE_LOADER: $(TEST_HOST)
