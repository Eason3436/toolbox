name: Build Screenshots IPA

# 只在手動觸發時打包（不要每次推送都打包）
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27（iOS 27 SDK）映像檔
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Screenshots
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          STATUS=0
          xcodebuild \
            -project Screenshots.xcodeproj \
            -scheme Screenshots \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || STATUS=$?
          grep -E "(error|warning):" build.log | sort -u | head -150 || true
          tail -3 build.log
          exit $STATUS

      - name: Embed entitlements (App Group) with ad-hoc signature
        run: |
          # 沒有正式簽署也要把 App Group 權限寫進執行檔，SideStore 重新簽署時才會沿用
          APP=build/Build/Products/Release-iphoneos/Screenshots.app
          codesign -f -s - --entitlements ShareExtension/ShareExtension.entitlements "$APP/PlugIns/ShareExtension.appex"
          codesign -f -s - --entitlements Screenshots/Screenshots.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Screenshots.app Payload/
          zip -qry Screenshots.ipa Payload
          ls -lh Screenshots.ipa

      - name: Unit tests (simulator)
        continue-on-error: true
        run: |
          xcrun simctl list devices available | grep -i iphone | head -20 || true
          DEST=$(xcrun simctl list devices available | grep -E "iPhone 17 Pro Max" | head -1 | grep -oE "[0-9A-F-]{36}" || true)
          if [ -z "$DEST" ]; then DEST=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}"); fi
          set -o pipefail
          xcodebuild test \
            -project Screenshots.xcodeproj \
            -scheme Screenshots \
            -destination "id=$DEST" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || STATUS=$?
          grep -E "(error:|✘|✔|Test run|failed|passed)" test.log | tail -80 || true
          exit ${STATUS:-0}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-build-log
          path: |
            Screenshots/build.log
            Screenshots/test.log

      - uses: actions/upload-artifact@v4
        with:
          name: Screenshots-ipa
          path: Screenshots/Screenshots.ipa

      - name: Publish to "screenshots-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete screenshots-latest --yes --cleanup-tag || true
          gh release create screenshots-latest Screenshots.ipa \
            --target "$GITHUB_SHA" \
            --title "Screenshots 最新版本（${GITHUB_SHA::7}，${GITHUB_REF_NAME}）" \
            --notes "用 SideStore 安裝：在 iPhone 上下載 Screenshots.ipa，然後在 SideStore 的 My Apps 按 + 選這個檔案。" \
            --prerelease
