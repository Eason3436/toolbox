name: Build Screenshots IPA

on:
  push:
    paths:
      - "Screenshots/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27（iOS 27 SDK）映像檔
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Screenshots
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          STATUS=0
          xcodebuild \
            -project Screenshots.xcodeproj \
            -scheme Screenshots \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || STATUS=$?
          grep -E "(error|warning):" build.log | sort -u | head -150 || true
          tail -3 build.log
          exit $STATUS

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Screenshots.app Payload/
          zip -qry Screenshots.ipa Payload
          ls -lh Screenshots.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-build-log
          path: Screenshots/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: Screenshots-ipa
          path: Screenshots/Screenshots.ipa

      - name: Publish to "screenshots-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete screenshots-latest --yes --cleanup-tag || true
          gh release create screenshots-latest Screenshots.ipa \
            --target "$GITHUB_SHA" \
            --title "Screenshots 最新版本（${GITHUB_SHA::7}，${GITHUB_REF_NAME}）" \
            --notes "用 SideStore 安裝：在 iPhone 上下載 Screenshots.ipa，然後在 SideStore 的 My Apps 按 + 選這個檔案。" \
            --prerelease
