name: Probe Xcode versions
on: push
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-27, macos-26-arm64]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: ls -d /Applications/Xcode*.app; xcodebuild -version; xcodebuild -showsdks | grep -i iphoneos
