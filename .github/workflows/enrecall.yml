name: Build EnRecall IPA

# EnRecall iOS：背單字（FSRS、單字商店、從 Claude 匯入）
on:
  workflow_dispatch:
  push:
    paths:
      - "EnRecall/**"
      - ".github/workflows/enrecall.yml"

permissions:
  contents: write

concurrency:
  group: enrecall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27（iOS 27 SDK）
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: EnRecall
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      # 後端網址和 key 放在 repo 的 Actions Secrets，不進公開的原始碼
      - name: Backend config
        id: config
        env:
          HOST: ${{ secrets.ENRECALL_SUPABASE_HOST }}
          KEY: ${{ secrets.ENRECALL_SUPABASE_ANON_KEY }}
        run: |
          # 沒設 secrets：從目前發佈的 EnRecall.ipa 讀回同一組值（本來就在 App 的 Info.plist 裡），不經過 repo
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            OLD=$(mktemp -d)
            if curl -sSfL -o "$OLD/old.ipa" https://github.com/${{ github.repository }}/releases/download/enrecall-latest/EnRecall.ipa \
              && unzip -q -o "$OLD/old.ipa" 'Payload/EnRecall.app/Info.plist' -d "$OLD"; then
              PLIST="$OLD/Payload/EnRecall.app/Info.plist"
              HOST=$(plutil -extract ERSupabaseHost raw -o - "$PLIST" 2>/dev/null || true)
              KEY=$(plutil -extract ERSupabaseAnonKey raw -o - "$PLIST" 2>/dev/null || true)
              [ "$HOST" = "PLACEHOLDER" ] && HOST=""
              [ "$KEY" = "PLACEHOLDER" ] && KEY=""
            fi
            rm -rf "$OLD"
            if [ -n "$HOST" ]; then echo "::add-mask::$HOST"; fi
            if [ -n "$KEY" ]; then echo "::add-mask::$KEY"; fi
            if [ -n "$HOST" ] && [ -n "$KEY" ]; then
              echo "沒有設定 secrets，改用目前發佈版本裡的後端設定"
            fi
          fi
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::warning::沒有設定 ENRECALL_SUPABASE_HOST／ENRECALL_SUPABASE_ANON_KEY：照樣編譯和測試，但不發佈 release"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'SUPABASE_HOST = %s\nSUPABASE_ANON_KEY = %s\n' "$HOST" "$KEY" > EnRecall/Config/Secrets.xcconfig
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          STATUS=0
          xcodebuild \
            -project EnRecall.xcodeproj \
            -scheme EnRecall \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || STATUS=$?
          grep -E "error:" build.log | sort -u | head -150 || true
          tail -3 build.log
          exit $STATUS

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/EnRecall.app Payload/
          zip -qry EnRecall.ipa Payload
          ls -lh EnRecall.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enrecall-build-log
          path: EnRecall/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: EnRecall-ipa
          path: EnRecall/EnRecall.ipa

      - name: Publish to "enrecall-latest" release
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete enrecall-latest --yes --cleanup-tag || true
          gh release create enrecall-latest EnRecall.ipa \
            --target "$GITHUB_SHA" \
            --title "EnRecall（${GITHUB_SHA::7}）" \
            --notes "EnRecall iOS（iOS 27、Liquid Glass）。用 SideStore 安裝：在 iPhone 上下載 EnRecall.ipa，然後在 SideStore 的 My Apps 按 + 選這個檔案。" \
            --prerelease

      - name: Unit tests (simulator)
        continue-on-error: true
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "Simulator: $DEST"
          xcodebuild test \
            -project EnRecall.xcodeproj \
            -scheme EnRecall \
            -destination "id=$DEST" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || STATUS=$?
          grep -E "(error:|✘|✔|Test run|failed|passed|Executed)" test.log | tail -80 || true
          exit ${STATUS:-0}
