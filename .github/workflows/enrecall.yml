name: Build EnRecall IPA

# EnRecall iOS：背單字（FSRS、單字商店、從 Claude 匯入）
on:
  workflow_dispatch:
  push:
    paths:
      - "EnRecall/**"
      - ".github/workflows/enrecall.yml"

permissions:
  contents: write

concurrency:
  group: enrecall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27（iOS 27 SDK）
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: EnRecall
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          STATUS=0
          xcodebuild \
            -project EnRecall.xcodeproj \
            -scheme EnRecall \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || STATUS=$?
          grep -E "error:" build.log | sort -u | head -150 || true
          tail -3 build.log
          exit $STATUS

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/EnRecall.app Payload/
          zip -qry EnRecall.ipa Payload
          ls -lh EnRecall.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enrecall-build-log
          path: EnRecall/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: EnRecall-ipa
          path: EnRecall/EnRecall.ipa

      - name: Publish to "enrecall-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete enrecall-latest --yes --cleanup-tag || true
          gh release create enrecall-latest EnRecall.ipa \
            --target "$GITHUB_SHA" \
            --title "EnRecall（${GITHUB_SHA::7}）" \
            --notes "EnRecall iOS（iOS 27、Liquid Glass）。用 SideStore 安裝：在 iPhone 上下載 EnRecall.ipa，然後在 SideStore 的 My Apps 按 + 選這個檔案。" \
            --prerelease

      - name: Unit tests (simulator)
        continue-on-error: true
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "Simulator: $DEST"
          xcodebuild test \
            -project EnRecall.xcodeproj \
            -scheme EnRecall \
            -destination "id=$DEST" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || STATUS=$?
          grep -E "Test Case|error:|Executed" test.log | tail -60 || true
          exit ${STATUS:-0}
