name: Build DrivePlayer IPA

# DrivePlayer：Google Drive 影音播放器（AVPlayer + 本機串流代理 + TMDB）
on:
  workflow_dispatch:
  push:
    paths:
      - "DrivePlayer/**"
      - ".github/workflows/driveplayer.yml"

permissions:
  contents: write

concurrency:
  group: driveplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    # Packages/Core 是純 Swift，Linux 就能跑
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: DrivePlayer/Packages/Core
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: |
          swift --version
          swift test 2>&1 | tee test.log
          grep -E "Executed [0-9]+ tests" test.log | tail -1

  build:
    # Xcode 27（iOS 27 SDK；App 最低 iOS 18）
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: DrivePlayer
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      # Google Client ID 放在 repo 的 Actions Secrets，不進公開的原始碼。
      # TMDB API Key 不編進 IPA（Release 是公開的）：使用者在 App 的「設定」輸入，存在鑰匙圈
      - name: Secrets.xcconfig
        id: config
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
        run: |
          # 反轉的 Client ID 沒填就自己算：123-abc.apps.googleusercontent.com → com.googleusercontent.apps.123-abc
          if [ -z "$GOOGLE_REVERSED_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_ID" ]; then
            GOOGLE_REVERSED_CLIENT_ID="com.googleusercontent.apps.${GOOGLE_CLIENT_ID%.apps.googleusercontent.com}"
          fi
          : > Config/Secrets.xcconfig
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            echo "GOOGLE_CLIENT_ID = $GOOGLE_CLIENT_ID" >> Config/Secrets.xcconfig
            echo "GOOGLE_REVERSED_CLIENT_ID = $GOOGLE_REVERSED_CLIENT_ID" >> Config/Secrets.xcconfig
          fi
          MISSING=""
          [ -z "$GOOGLE_CLIENT_ID" ] && MISSING="$MISSING GOOGLE_CLIENT_ID"
          if [ -n "$MISSING" ]; then
            echo "::warning::沒有設定 Actions Secrets：${MISSING}。照樣編譯，但 App 裡對應的功能會顯示「尚未設定」"
            echo "notes=⚠️ 這次編譯沒有設定：${MISSING}（App 裡對應功能無法使用）。" >> "$GITHUB_OUTPUT"
          else
            echo "notes=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          STATUS=0
          xcodebuild \
            -project DrivePlayer.xcodeproj \
            -scheme DrivePlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || STATUS=$?
          grep -E "error:" build.log | sort -u | head -150 || true
          tail -3 build.log
          exit $STATUS

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DrivePlayer.app Payload/
          zip -qry DrivePlayer.ipa Payload
          ls -lh DrivePlayer.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driveplayer-build-log
          path: DrivePlayer/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: DrivePlayer-ipa
          path: DrivePlayer/DrivePlayer.ipa

      - name: Publish to "driveplayer-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          EXTRA: ${{ steps.config.outputs.notes }}
        run: |
          gh release delete driveplayer-latest --yes --cleanup-tag || true
          gh release create driveplayer-latest DrivePlayer.ipa \
            --target "$GITHUB_SHA" \
            --title "DrivePlayer（${GITHUB_SHA::7}）" \
            --notes "DrivePlayer：Google Drive 影音播放器（iOS 18 以上）。用 Sideloadly 或 SideStore 安裝，詳見 DrivePlayer/README.md。${EXTRA}" \
            --prerelease
