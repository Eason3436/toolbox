name: Build IPA

on:
  push:
    paths-ignore:
      - "Screenshots/**"
      - ".github/workflows/screenshots.yml"
      - "Ledger/**"
      - ".github/workflows/ledger.yml"
      - "LedgerMagnet/**"
      - ".github/workflows/ledger-magnet.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (prefer Xcode 27 / iOS 27 SDK)
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          STATUS=0
          xcodebuild \
            -project Toolbox.xcodeproj \
            -scheme Toolbox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || STATUS=$?
          grep -E "error:" build.log | sort -u | head -150 || true
          tail -3 build.log
          exit $STATUS

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Toolbox.app Payload/
          zip -qry Toolbox.ipa Payload
          ls -lh Toolbox.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: Toolbox-ipa
          path: Toolbox.ipa

      - name: Unit tests (simulator)
        continue-on-error: true
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "Simulator: $DEST"
          xcodebuild test \
            -project Toolbox.xcodeproj \
            -scheme Toolbox \
            -destination "id=$DEST" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || STATUS=$?
          grep -E "Test Case|error:|Executed" test.log | tail -60 || true
          exit ${STATUS:-0}

      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Toolbox.ipa \
            --title "最新版本（${GITHUB_SHA::7}）" \
            --notes "用 SideStore 安裝：在 iPhone 上下載 Toolbox.ipa，然後在 SideStore 的 My Apps 按 + 選這個檔案。" \
            --prerelease
