name: Build LedgerMagnet IPA

# 記帳 App 的磁力特別版（LedgerMagnet/）：磁鐵靠近時元素被吸過去
on:
  workflow_dispatch:
  push:
    paths:
      - "LedgerMagnet/**"
      - ".github/workflows/ledger-magnet.yml"

permissions:
  contents: write

concurrency:
  group: ledger-magnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27（iOS 27 SDK）
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: LedgerMagnet
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          STATUS=0
          xcodebuild \
            -project LedgerMagnet.xcodeproj \
            -scheme Ledger \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || STATUS=$?
          grep -E "error:" build.log | sort -u | head -150 || true
          tail -3 build.log
          exit $STATUS

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Ledger.app Payload/
          zip -qry LedgerMagnet.ipa Payload
          ls -lh LedgerMagnet.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledger-magnet-build-log
          path: LedgerMagnet/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: LedgerMagnet-ipa
          path: LedgerMagnet/LedgerMagnet.ipa

      - name: Publish to "ledger-magnet-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ledger-magnet-latest --yes --cleanup-tag || true
          gh release create ledger-magnet-latest LedgerMagnet.ipa \
            --target "$GITHUB_SHA" \
            --title "記帳磁力特別版 LedgerMagnet（${GITHUB_SHA::7}）" \
            --notes "記帳 App 的磁力特別版：拿磁鐵靠近手機，畫面元素會被吸過去。跟原本的記帳是不同 App（com.eason3436.ledger.magnet），資料分開。用 SideStore 安裝：在 iPhone 上下載 LedgerMagnet.ipa，然後在 SideStore 的 My Apps 按 + 選這個檔案。" \
            --prerelease

      - name: Unit tests (simulator)
        continue-on-error: true
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "Simulator: $DEST"
          xcodebuild test \
            -project LedgerMagnet.xcodeproj \
            -scheme Ledger \
            -destination "id=$DEST" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || STATUS=$?
          grep -E "Test Case|error:|Executed" test.log | tail -60 || true
          exit ${STATUS:-0}
