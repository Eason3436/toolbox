name: DrivePlayer
options:
  bundleIdPrefix: com.yueze
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  Core:
    path: Packages/Core
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  DrivePlayer:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: App
    dependencies:
      - package: Core
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: DrivePlayer
        CFBundleName: DrivePlayer
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        UIUserInterfaceStyle: Dark
        # 本機代理：AVPlayer 播 http://127.0.0.1:{port}/stream/{fileId}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Google 登入（值由 CI 從 GitHub Secrets 寫進 Secrets.xcconfig）
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: GoogleSignIn
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        DPTMDBAPIKey: $(TMDB_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yueze.driveplayer
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  DrivePlayer:
    build:
      targets:
        DrivePlayer: all
